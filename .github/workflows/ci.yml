name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test and build
        run: npm run check

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: 139pan-tmdb-renamer
          path: dist/139pan-tmdb-renamer.user.js
          if-no-files-found: error
          retention-days: 14
